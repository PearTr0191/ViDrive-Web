<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-adaptive favicon. The in-app theme (light/dark, toggled in the UI and
         persisted to localStorage 'vidrive-theme') drives the favicon. ThemeProvider
         in src/lib/theme.tsx swaps the href between the light and dark SVG variants on
         every theme change, with a cache-busting query so Chromium repaints reliably. -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="apple-touch-icon" href="/favicon-light.svg" />
    <!-- Preload hero back-layer images so the Landing car paints instantly (no load-induced pop).
         Each variant only loads for its matching color scheme to avoid preloading both unconditionally. -->
    <link rel="preload" as="image" href="/hero/lucid-light.jpg" media="(prefers-color-scheme: light)" />
    <link rel="preload" as="image" href="/hero/lucid-dark.jpg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)" />
    <meta property="og:image" content="https://vidrive-web.pages.dev/og-tco.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ViDrive — công cụ tính tổng chi phí sở hữu ô tô (TCO) minh bạch tại Việt Nam" />
    <!-- Pre-paint theme: set light/dark + color-scheme before first paint to avoid FOUC/CLS -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vidrive-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var d = document.documentElement;
          d.classList.add(t);
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <title>ViDrive — Tính chi phí sở hữu ô tô</title>
    <meta name="description" content="Tính chi phí sở hữu ô tô (TCO) Việt Nam: so sánh xe điện, hybrid, xăng; định giá xe cũ. Minh bạch, tức thì.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@8..144,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@8..144,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@8..144,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

    <div id="app"></div>

</html>
